[env:esp32dev]
platform = espressif32@6.12.0

board = pico32
framework = arduino
# Preserve the original ESP-WORKS MultiLoader partition map for PlatformIO.
board_build.partitions = partitions.csv

lib_deps =
    https://github.com/fdivitto/FabGL.git#v1.0.9

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; v0.97: real CT2/C020 tape audio mixed in existing GPIO25 DAC;
    ; F1 10-row menu with independent SOM FITAS K7 (ON default).
    ; v0.95: FPGA gameport C06x mirrors and C07x paddle strobe
    ; all 16 address variants, no changes to joystick neutral position.
    ; v0.94: guest CPU scans queued PS/2 MAKE/BREAK transitions with
    ; fully repaid cycle budget; generic keyboard/joystick matrix bridge.
    ; v0.93: input release confirmed across multiple PS/2 polls,
    ; passive paddle timing starts on first read if no C070 strobe.
    ; v0.92: CONTROL is a separate MAME matrix row and joystick scanning
    ; uses universal Windows 0.3/MAME row contacts; Moon K7 OSD removed.
    ; v0.91: native TK-2000 CONTROL shortcuts require no SHIFT;
    ; BASIC keyword tokens require physical CONTROL + SHIFT + letter.
    ; v0.90: universal controls, without game-specific mappings by default.
    ; Change to 1 ONLY to restore the older v0.88 game-specific mappings.
    -DTK2000_GAME_JOYSTICK_COMPAT=0
    ; v0.96: one host key = one TK contact (no A/Z/SPACE bridge).
    -DTK2000_JOYSTICK_KEYBOARD_BRIDGE=0
    -DTK2000_INPUT_INTERLEAVE=1
    ; v0.96: Apple PREAD at JSR $FB1E only with JOYSTICK ON; OFF = pure ROM.
    -DTK2000_UNIVERSAL_PREAD=1
    -DTK2000_JOYSTICK_STANDARD_MODE=0
    -DTK2000_VGA_WORD_STORES=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_ARDUHAL_LOG_COLORS
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -O3

build_unflags =
    -DCONFIG_IDF_TARGET_ESP32
    -Wall
    -Wextra
    -DARDUINO_RUNNING_CORE
    -DARDUINO_EVENT_RUNNING_CORE

build_type = release
